<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission - MAGAZAWA SKILLS AND TECHNOLOGY</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        input[type="text"], input[type="email"], input[type="date"], input[type="password"], input[type="file"] {
            width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;
        }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>MAGAZAWA SKILLS AND TECHNOLOGY</h2>
    <h3>Student Admission Form</h3>

    <form action="{{ url_for('apply_student') }}" method="POST" enctype="multipart/form-data">
        
        <!-- Passport Photo / Profile Picture -->
        <div class="form-group">
            <label for="profile_picture"><b>Passport Photo / Profile Picture:</b></label>
            <input type="file" id="profile_picture" name="profile_picture" accept="image/*" required>
        </div>

        <h4>1. Personal Information</h4>
        <input type="text" name="full_name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        
        <label for="dob"><b>Date of Birth:</b></label>
        <input type="date" id="dob" name="dob" required>
        
        <input type="password" name="password" placeholder="Create Password" required>

        <h4>2. Educational Background & Certificates</h4>
        <input type="text" name="primary_school" placeholder="Primary School Name" required>
        
        <label for="primary_cert"><b>Primary Certificate File:</b></label>
        <input type="file" id="primary_cert" name="primary_cert" required>
        
        <input type="text" name="sec_school" placeholder="Secondary School Name" required>
        
        <label for="sec_cert"><b>Secondary Certificate File:</b></label>
        <input type="file" id="sec_cert" name="sec_cert" required>

        <button type="submit">Submit Application</button>
    </form>

    <br><a href="{{ url_for('login') }}">Back to Login</a>
</body>
</html>
