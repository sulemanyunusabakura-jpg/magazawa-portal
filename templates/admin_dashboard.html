<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MST Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MST Admin Portal</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3"><i class="fas fa-user-shield me-1"></i> Admin</span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category in ['error', 'danger'] else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="row g-4">
            <!-- Add Course Panel -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white font-bold">
                        <i class="fas fa-book-medical me-2"></i>Create New Course
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('add_course') }}" method="POST">
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Course Code</label>
                                <input type="text" name="course_code" class="form-control" placeholder="e.g. CME 411" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Course Name</label>
                                <input type="text" name="course_name" class="form-control" placeholder="e.g. Software Engineering" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label small fw-bold">Credit Unit</label>
                                    <input type="number" name="unit" class="form-control" value="3" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label small fw-bold">Semester</label>
                                    <input type="number" name="semester" class="form-control" value="1" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-2">Add & Assign Course</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Add Result Panel -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white font-bold">
                        <i class="fas fa-graduation-cap me-2"></i>Publish Student Result
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('add_result') }}" method="POST">
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Select Student</label>
                                <select name="student_id" class="form-select" required>
                                    <option value="">-- Choose Student --</option>
                                    {% for std in students %}
                                        <option value="{{ std.id }}">{{ std.full_name }} ({{ std.username }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label class="form-label small fw-bold">Course Code</label>
                                    <input type="text" name="course_code" class="form-control" placeholder="CME 411" required>
                                </div>
                                <div class="col-6 mb-2">
                                    <label class="form-label small fw-bold">Grade</label>
                                    <select name="grade" class="form-select" required>
                                        <option value="A">A</option>
                                        <option value="AB">AB</option>
                                        <option value="B">B</option>
                                        <option value="BC">BC</option>
                                        <option value="C">C</option>
                                        <option value="CD">CD</option>
                                        <option value="D">D</option>
                                        <option value="E">E</option>
                                        <option value="F">F</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Course Title</label>
                                <input type="text" name="title" class="form-control" placeholder="Computer Architecture" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mt-2">Publish Result</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
